[project]
name = "carbon-tracking-mcp"
version = "0.1.0"
description = "MCP servers exposing session energy estimates from mcps.energy_estimate"
requires-python = ">=3.14"
dependencies = [
    "fastmcp>=4.0.3",
]

[project.scripts]
carbon-tracking-stdio-claude = "mcps.stdio.server_claude:main"
carbon-tracking-stdio-codex = "mcps.stdio.server_codex:main"
carbon-tracking-energy-estimate = "mcps.energy_estimate:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcps"]

[dependency-groups]
dev = [
    { include-group = "test" },
    "ruff>=0.16.7",
]
test = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py314"
